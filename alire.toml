name = "representation"
description = "Typed transport-independent external representation contracts"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/representation"
long-description = "Strongly typed, transport-independent framework for defining, validating, versioning, encoding, and decoding stable external application representations in Ada 2022."

tags = ["representation", "serialization", "json", "schema", "headless"]

[[depends-on]]
gnat_native = "=15.2.1"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests/representation_tests && alr build && ./bin/tests"]

[build-profiles]
"*" = "development"
